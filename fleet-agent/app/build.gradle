plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fleetmonitor.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.fleetmonitor.agent"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally none — uses only the Android platform (HttpURLConnection + org.json).
}
